<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style.css">
    <script src="dist/script.js" type="module"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <title>RPIGames</title>
  </head>
  <body>
    <div id="topbar" class="flex">
      <a href="/"><img id="top-logo" src="/static/RPIGamesLogo.svg" alt="RPIGames Logo" class="center-align"></a>
      <div class="flex menu-wrapper">
        <div class="nav-user" id="username">Signed Out</div>
        <button class="hamburgerButton">
          <img id="hamburgerOpen" src="/static/hamburger.svg"/>
          <img id="hamburgerClose" src="/static/close.svg"/>
        </button>
      </div>
    </div>
      <div id="sidenav">
        <button class="pageChange" data-url="home" data-div="">Home</button>
        <button class="pageChange" data-url="lobbies" data-div="lobby-main">Lobbies</button>
        <button class="pageChange" data-url="chat" data-div="">Chat</button>
      </div>
    <div id="middle-div" class="flex w-max h-max p-8 h-windowMax">
      <div id="center-wrapper" class="w-max">
        <div id="center-content">
          <!--Dynamic Content will be inserted here-->
        </div>
      </div>
    <div id="notification-box"></div>
    </div>

    <footer id="footer">
      <ul id="footer-links" class="footer-linkbox">
        <li id="footer-links-privacy-policy">
          <button class="pageChange linkButton" data-url="privacy" data-div="">Privacy Policy</button>
        </li>
        <li id="footer-links-github">
          <a href="https://github.com/RPIGames/RPIGames/" referrerpolicy="no-referrer" rel="external">Github Repository</a>
        </li>
        <li id="footer-links-rcos">
          An <a href="https://rcos.io/" rel="external">RCOS</a> Project
        </li>
      </ul>
    </footer>
  </body>
</html>
